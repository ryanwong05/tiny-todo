<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tiny Todo</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 650px;
      margin: 60px auto;
      padding: 0 20px;
      line-height: 1.5;
    }

    h1 {
      margin-bottom: 20px;
    }

    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    input {
      flex: 1;
      padding: 10px;
      font-size: 16px;
    }

    button {
      padding: 10px 14px;
      cursor: pointer;
      font-size: 14px;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid #ddd;
    }

    .task-text {
      flex: 1;
    }

    .done {
      text-decoration: line-through;
      opacity: 0.5;
    }

    .ai-section {
      margin-top: 35px;
      padding-top: 25px;
      border-top: 1px solid #ddd;
    }

    .api-input {
      width: 100%;
      box-sizing: border-box;
      margin-bottom: 10px;
    }

    #summary {
      margin-top: 15px;
      padding: 12px;
      background: #f5f5f5;
      border-radius: 6px;
      min-height: 20px;
    }
  </style>
</head>

<body>

  <h1>My Todo List</h1>

  <div class="input-row">
    <input
      id="taskInput"
      type="text"
      placeholder="Enter a task"
    >
    <button onclick="addTask()">Add</button>
  </div>

  <ul id="taskList"></ul>

  <div class="ai-section">
    <h2>AI Day Summary</h2>

    <input
      id="apiKey"
      class="api-input"
      type="password"
      placeholder="Paste your Groq API key here (not saved)"
    >

    <button onclick="summarizeDay()">
      Summarize My Day
    </button>

    <p id="summary"></p>
  </div>

  <script>
    let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

    function saveTasks() {
      localStorage.setItem("tasks", JSON.stringify(tasks));
    }

    function renderTasks() {
      const taskList = document.getElementById("taskList");
      taskList.innerHTML = "";

      for (let i = 0; i < tasks.length; i++) {
        const li = document.createElement("li");

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = tasks[i].done;

        checkbox.onchange = function() {
          tasks[i].done = checkbox.checked;
          saveTasks();
          renderTasks();
        };

        const span = document.createElement("span");
        span.textContent = tasks[i].text;
        span.className = "task-text";

        if (tasks[i].done) {
          span.classList.add("done");
        }

        const deleteButton = document.createElement("button");
        deleteButton.textContent = "Delete";

        deleteButton.onclick = function() {
          tasks.splice(i, 1);
          saveTasks();
          renderTasks();
        };

        li.appendChild(checkbox);
        li.appendChild(span);
        li.appendChild(deleteButton);

        taskList.appendChild(li);
      }
    }

    function addTask() {
      const input = document.getElementById("taskInput");
      const text = input.value.trim();

      if (text === "") {
        return;
      }

      tasks.push({
        text: text,
        done: false
      });

      input.value = "";

      saveTasks();
      renderTasks();
    }

    async function summarizeDay() {
      const apiKey = document.getElementById("apiKey").value.trim();
      const summary = document.getElementById("summary");

      if (apiKey === "") {
        summary.textContent = "Please enter your Groq API key.";
        return;
      }

      if (tasks.length === 0) {
        summary.textContent = "Add some tasks first.";
        return;
      }

      const taskText = tasks.map(function(task) {
        const status = task.done ? "done" : "not done";
        return task.text + " (" + status + ")";
      }).join("\n");

      const prompt =
        "Here is my todo list:\n" +
        taskText +
        "\n\nSummarize what my day looks like in exactly one concise sentence.";

      summary.textContent = "Generating summary...";

      try {
        const response = await fetch(
          "https://api.groq.com/openai/v1/chat/completions",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Authorization": "Bearer " + apiKey
            },
            body: JSON.stringify({
              model: "openai/gpt-oss-20b",
              messages: [
                {
                  role: "user",
                  content: prompt
                }
              ]
            })
          }
        );

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data.error?.message || "API request failed"
          );
        }

        summary.textContent =
          data.choices[0].message.content;
      }
      catch (error) {
        summary.textContent =
          "Error: " + error.message;
      }
    }

    document
      .getElementById("taskInput")
      .addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
          addTask();
        }
      });

    renderTasks();
  </script>

</body>
</html>
